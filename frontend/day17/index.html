<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .card {
            width: 250px;
            height: 250px;
            margin: 200px auto;
            box-shadow: 0px 0px 2px gray;
            overflow: hidden;
        }

        img {
            transition: 1s;
            transform-origin: bottom right;
        }

        .card:hover img {
            transform: translate(200px) rotate(200deg);
            
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsLQXHMtyyE-LPaFp-NMck38n4ri6sEguJ7oK8GWO9tg&s"
            width="100%" height="100%" alt="">
    </div>



</body>

</html>
