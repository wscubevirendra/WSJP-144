<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            width: 1000px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;

            margin: auto;
        }

        .card {
            box-shadow: 0px 0px 1px gray;
            border-radius: 20px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 200px;
        }

        .overlay {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            display: none;
        }

        .close {
            padding: 4px 10px;
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: red;
            color: white;
        }

        .open {
            display: block !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card"><img src="https://picsum.photos/200/300?random=1"></div>
        <div class="card"><img src="https://picsum.photos/200/300?random=2"></div>
        <div class="card"><img src="https://picsum.photos/200/300?random=3"></div>
        <div class="card"><img src="https://picsum.photos/200/300?random=4"></div>
        <div class="card"><img src="https://picsum.photos/200/300?random=5"></div>
        <div class="card"><img src="https://picsum.photos/200/300?random=6"></div>
        <div class="card"><img src="https://picsum.photos/200/300?random=7"></div>
        <div class="card"><img src="https://picsum.photos/200/300?random=8"></div>

    </div>

    <div class="overlay">
        <img width="100%" height="100%" src="https://picsum.photos/200/300?random=8">
        <button class="close">Close</button>
    </div>


    <script>
        const cards = document.querySelectorAll(".card");
        const overlay = document.querySelector(".overlay");
        const closeBtn = document.querySelector(".close");
        const mainImage = document.querySelector(".overlay img");


        for (const card of cards) {
            card.addEventListener("click", (event) => {
                const src = event.target.src;
                overlay.classList.add("open");
                mainImage.src=src
               
            })

        }

        closeBtn.addEventListener("click",()=>{
                overlay.classList.remove("open")

        })

    </script>

</body>

</html>
