<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            width: 900px;
            height: 500px;
            border: 2px solid black;
            margin: 20px auto;
            /* padding: 20px; */
            display: flex;
            flex-wrap: wrap;
            gap: 30px;

        }

        .box {
            width: 200px;
        
            border: 2px solid green;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">Box1</div>
        <div class="box">Box2</div>
        <div class="box">Box3</div>
        <div class="box">Box4</div>
        

    </div>

</body>

</html>
