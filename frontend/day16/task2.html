<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .card {
            width: 300px;
            height: 300px;
            box-shadow: 0px 0px 2px gray;
            margin: 150px auto;
            position: relative;
            overflow: hidden;

        }
        .card img {
            width: 100%;
            height: 100%;
        }
        .left-overlay {
            width: 50%;
            height: 100%;
            background-color: rgba(0, 200, 0, 0.7);
            position: absolute;
            top: 0;
            left: 0;
            transition: 600ms;
        }
        .right-overlay {
            width: 50%;
            height: 100%;
            background-color: rgba(200, 0, 0, 0.7);
            position: absolute;
            top: 0;
            right: 0;
            transition: 600ms;
        }
        .card:hover .left-overlay {
            left: -100%;
        }
        
        .card:hover .right-overlay {
            right: -100%;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="elodie-debard-3suUDohyMZ0-unsplash.jpg">
        <div class="left-overlay"></div>
        <div class="right-overlay"></div>
    </div>

</body>

</html>
