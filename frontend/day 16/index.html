<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .card {
            width: 250px;
            height: 250px;
            background-color: steelblue;
            margin: 50px auto;
            box-shadow: 0px 1px 1px gray;
            position: relative;
        }

        .circle {
            width: 40px;
            height: 40px;
            background-color: red;
            position: absolute;
            top: 40%;
            left: 40%;
            border-radius: 50%;
            transition: 1s;

        }

        .card:hover .circle{
            top: 0;
            left: 200px;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="https://picsum.photos/250/250?random=1">
        <div class="circle"></div>
    </div>

</body>

</html>
