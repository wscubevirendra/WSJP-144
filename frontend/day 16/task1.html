<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .card {
            width: 250px;
            height: 250px;
            box-shadow: 0px 2px 3px gray;
            margin: 50px auto;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            background-color: red;
        }

        .overlay {
            width: 100%;
            height: 100%;
            background-color: rgba(200, 0, 0, 0.5);
            position: absolute;
            top: 100%;
            left: 0;
            transition: 1s;
        }

        .card:hover .overlay {
            top: 0;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWrvexHfBXhgkFAG8tdl9TK_JWfWk8ifmv5P96KEvBDd0_dtHKFHyaZFc_&s=10"
            width="100%" height="100%">

        <div class="overlay">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Omnis, et reprehenderit autem impedit earum velit quisquam perferendis voluptatibus labore repudiandae aperiam minus? In amet possimus laudantium aperiam optio corrupti hic?
        </div>
    </div>

</body>

</html>
